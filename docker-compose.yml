services:
  nginx:
    build: ./nginx
    container_name: desafio-nginx
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - node-network
    restart: on-failure

  app:
    build: ./node
    container_name: desafio-app
    volumes:
      - ./node:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: nodedb
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - node-network
    restart: on-failure

  db:
    image: mysql:8.0
    container_name: desafio-db
    command: --innodb-use-native-aio=0 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: nodedb
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - node-network
    restart: unless-stopped

networks:
  node-network:
    driver: bridge

volumes:
  db_data:
  node_modules:
